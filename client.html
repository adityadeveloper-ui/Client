<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIZARD WEB PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d;
  --line:#2c3748; --cyan:#00b8f0; --text:#e8eef6; --muted:#8793a5;
  --grad:linear-gradient(90deg,#0090f0,#00e5ff); --danger:#ff5d6c; --ok:#2ee59d; --row:#111a2b;
  --btn-ink:#fff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
    --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
  --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
}
:root[data-theme="dark"]{
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d; --line:#2c3748; --cyan:#00b8f0;
  --text:#e8eef6; --muted:#8793a5; --row:#111a2b; --btn-ink:#fff;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.wrap.wide{max-width:760px}
.disp{font-family:Orbitron,Roboto,sans-serif;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

/* panel header */
.head{display:grid;grid-template-columns:1fr auto;gap:14px 12px;font-size:14px}
.head .r{text-align:right}
.rule{height:2px;background:var(--cyan);opacity:.9;margin:22px 0}
.rule.tall{margin:40px 0 22px}

.dash{border:2px dashed var(--line);border-radius:16px;padding:18px;background:transparent;margin-bottom:18px}
.dash .lbl{display:block;font-size:17px;margin:0 0 10px;color:var(--text)}
.in{display:block;width:100%;background:var(--field);border:1px solid transparent;border-radius:14px;height:60px;padding:0 18px;font-size:19px;margin-bottom:20px}
.in:focus{border-color:var(--cyan);outline:0}
.in.deep{background:var(--field-deep);border-color:var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--field-deep);border:1px solid var(--line);border-radius:14px;padding:0 16px;height:58px;margin-bottom:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:19px}
.search input::placeholder,.in::placeholder{color:var(--muted)}
.sel{position:relative;margin-bottom:16px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:62px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 50px 0 22px;font-size:21px;cursor:pointer}
.sel::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:block;width:100%;height:58px;border:0;border-radius:16px;background:var(--grad);color:var(--btn-ink);font-weight:700;font-size:18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.big{height:64px;border-radius:20px;font-size:19px}
.btn.dark{background:#000;color:#fff;height:58px;border-radius:0;margin-top:14px}
.btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--row);border:0;border-radius:10px;padding:18px 20px;font-size:21px;cursor:pointer;text-align:left}
.fold span.ar{font-size:15px;transition:transform .15s}
.fold[aria-expanded="true"] span.ar{transform:rotate(90deg)}
.fold-body{display:none;padding:16px 4px 0}
.fold-body.open{display:block}
.note{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.live{color:var(--muted);font-size:14px;margin-top:12px}
.live b{color:var(--text);font-weight:500}
.err{color:var(--danger);font-size:15px;margin:-6px 0 14px;min-height:1px}
.demo-link{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:22px;text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}

/* owner site */
.title{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 18px}
.card-h{font-size:19px;margin:0 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.in.s{height:50px;font-size:16px;margin-bottom:12px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:500;word-break:break-word}
.item .meta{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.mini.del{color:var(--danger)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--danger);border-color:var(--danger)}
.cred{background:var(--field);border:1px solid var(--cyan);border-radius:14px;padding:14px;margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.staged{background:var(--field);border-radius:12px;padding:12px;margin-bottom:10px}
.staged small{color:var(--muted);display:block;margin-bottom:8px;word-break:break-all}
dialog{width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.link-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.link-row .u{flex:1;min-width:0;word-break:break-all;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--cyan);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.site-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var K="exp-web-panel-v2", mem=null;
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function rnd(n,set){var o="";for(var i=0;i<n;i++)o+=set.charAt(Math.floor(Math.random()*set.length));return o}
var SAMPLE='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b1626;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}h1{margin:0 0 10px}p{opacity:.8}</style></head><body><div><h1>Sample page</h1><p>UPI: {{UPI}}<br>Reference: {{TR}}</p></div></body></html>';

var REMOTE="https://wizard-web-fadd8-default-rtdb.firebaseio.com";
var BASE=REMOTE.replace(/\/+$/,"")+"/panel";
function ck(id){return String(id).trim().toLowerCase().replace(/[^a-z0-9@_-]/g,function(c){return "_"+c.charCodeAt(0).toString(16)+"_"})}
function arr(o){return !o?[]:Array.isArray(o)?o.filter(Boolean):Object.keys(o).map(function(k){return o[k]})}
function needSetup(){return /PASTE_FIREBASE_URL_HERE/.test(REMOTE)}
var db={owner:null,domain:"",scripts:[],clients:[]};
function load(){return db}
function pull(cb){
  Promise.all(["clients","scripts","domain"].map(function(n){return fetch(BASE+"/"+n+".json").then(function(r){if(!r.ok)throw 0;return r.json()})})).then(function(a){
    db={owner:null,domain:a[2]||"",scripts:arr(a[1]),clients:arr(a[0]).map(function(c){c.links=arr(c.links);return c})};
    if(cb)cb(true);
  }).catch(function(){if(cb)cb(false)});
}
var touched=null;
function save(){
  if(!touched)return;
  var p={};["upi","tr","pass","scriptId","visitors","links"].forEach(function(k){p[k]=touched[k]===undefined?null:touched[k]});
  fetch(BASE+"/clients/"+ck(touched.id)+".json",{method:"PATCH",body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0}).catch(function(){toast("Could not save. Check your connection")});
}
function refreshPick(){
  var p=$("#pick");if(!p||!$("#q"))return;
  var v=p.value,q=$("#q").value.trim().toLowerCase(),h='<option value="">Select a script</option>';
  db.scripts.forEach(function(s){if(s.name.toLowerCase().indexOf(q)>-1)h+='<option value="'+s.id+'">'+esc(s.name)+'</option>'});
  p.innerHTML=h;p.value=v;
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!needSetup())pull(function(ok){if(ok)refreshPick()})});
var clientId=null;

function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},2200)}
function copy(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied")},function(){fb()});return}}catch(e){}
  fb();
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Copied":"Press and hold to copy it manually")}
}
function daysLeft(c){return Math.ceil((c.expiresAt-Date.now())/86400000)}
function status(c){if(!c.active)return "disabled";if(c.expiresAt<=Date.now())return "expired";return "live"}
function scriptById(id){return db.scripts.filter(function(s){return s.id===id})[0]}
function clientByLogin(id){return db.clients.filter(function(c){return c.id.toLowerCase()===String(id).trim().toLowerCase()})[0]}
function clientBySlug(slug){return db.clients.filter(function(c){return c.links.indexOf(slug)>-1})[0]}
function slugTaken(slug){return db.clients.some(function(c){return c.links.indexOf(slug)>-1})}
function cleanSlug(s){return String(s).toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,30)}
function baseUrl(){var d=String(db.domain||"").trim().replace(/^https?:\/\//i,"").replace(/\/+$/,"");return d?"https://"+d:location.origin}
function fullUrl(slug){return baseUrl()+"/s/"+slug}
function slugFromPath(){var m=location.pathname.match(/^\/s\/([^\/?#]+)/);return m?decodeURIComponent(m[1]).toLowerCase():null}
function slugTakenRemote(slug,cb){
  fetch(BASE+"/clients.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
    cb(arr(o).some(function(c){return arr(c.links).indexOf(slug)>-1}),true)
  }).catch(function(){cb(false,false)});
}
function dlg(html){var d=$("#dlg");d.innerHTML=html;if(!d.open)d.showModal();return d}
function closeDlg(){var d=$("#dlg");if(d.open)d.close()}

/* ---------- router ---------- */
function route(){
  var h=location.hash||"#/panel";
  document.body.style.background="";
  var ps=slugFromPath();if(ps)return renderSite(ps);
  if(h.indexOf("#/s/")===0)return renderSite(h.slice(4));
  renderPanel();
}
window.addEventListener("hashchange",route);window.addEventListener("popstate",route);
function go(h){if(location.hash===h)route();else location.hash=h}

/* ---------- public site ---------- */
function renderSite(slug){
  var app=$("#app"),c=clientBySlug(slug);
  if(!c){app.innerHTML='<div class="site-msg">This link does not exist.</div>';return}
  if(status(c)!=="live"){app.innerHTML='<div class="site-msg">This page is not active right now.</div>';return}
  touched=c;
  var s=scriptById(c.scriptId);
  if(!s){app.innerHTML='<div class="site-msg">Coming soon.</div>';return}
  try{ if(!sessionStorage.getItem("v-"+slug)){sessionStorage.setItem("v-"+slug,"1");c.visitors=(c.visitors||0)+1;save()} }catch(e){}
  var html=s.html.split("{{UPI}}").join(c.upi||"").split("{{TR}}").join(c.tr||"");
  var data=JSON.stringify({upi:c.upi||"",tr:c.tr||""}).replace(/</g,"\\u003c");
  var inject='<script>window.PANEL='+data+';<\/script>';
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+inject}):inject+html;
  app.innerHTML='<iframe class="site-frame" id="siteFrame" sandbox="allow-scripts allow-forms allow-popups" title="Site"></iframe>';
  $("#siteFrame").srcdoc=html;
}

/* ---------- client panel ---------- */
function renderPanel(){
  var app=$("#app");
  var c=clientId?clientByLogin(clientId):null;
  if(c&&status(c)!=="live"){clientId=null;c=null}
  if(!c)return renderLogin();
  touched=c;
  var opts='<option value="">Select a script</option>';
  db.scripts.forEach(function(s){opts+='<option value="'+s.id+'">'+esc(s.name)+'</option>'});
  var cur=scriptById(c.scriptId);
  app.innerHTML=
  '<div class="wrap">'+
   '<div class="head disp"><div>WIZARD WEB PANEL</div><div class="r">Account Settings</div><div>Expiring in : '+daysLeft(c)+' days</div><div class="r">Visitors : '+(c.visitors||0)+'</div></div>'+
   '<div class="rule"></div>'+
   '<div class="dash">'+
     '<label class="lbl" for="upi">Enter Your UPI</label><input class="in" id="upi" value="'+esc(c.upi||"")+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
     '<label class="lbl" for="tr">Enter Your TR</label><input class="in" id="tr" value="'+esc(c.tr||"")+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
     '<button class="btn" id="saveBtn" style="margin-top:2px">Save Changes</button>'+
   '</div>'+
   '<button class="fold" id="pwFold" aria-expanded="false"><span>Change Password</span><span class="ar">&#9654;</span></button>'+
   '<div class="fold-body" id="pwBody">'+
     '<input class="in deep" id="pw0" type="password" placeholder="Current password" autocomplete="current-password">'+
     '<input class="in deep" id="pw1" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password">'+
     '<div class="err" id="pwErr"></div>'+
     '<button class="btn" id="pwBtn">Update Password</button>'+
   '</div>'+
   '<div class="rule tall"></div>'+
   '<div class="dash">'+
     '<label class="lbl" for="q">Choose a Script:</label>'+
     '<div class="search"><span aria-hidden="true">&#128269;</span><input id="q" type="search" placeholder="Search script by name..." autocomplete="off"></div>'+
     '<div class="sel"><select id="pick" aria-label="Script">'+opts+'</select></div>'+
     '<button class="btn" id="applyBtn">Apply Script</button>'+
     '<div class="live">Live now: <b id="liveName">'+(cur?esc(cur.name):"Nothing")+'</b></div>'+
   '</div>'+
   '<button class="btn big disp" id="linksBtn" style="letter-spacing:.12em;font-size:17px;text-transform:none">Manage Shortlinks</button>'+
   '<button class="btn dark disp" id="outBtn" style="text-transform:none;letter-spacing:.12em">Logout</button>'+
  '</div>';

  $("#saveBtn").onclick=function(){c.upi=$("#upi").value.trim();c.tr=$("#tr").value.trim();save();toast("Changes saved")};
  $("#pwFold").onclick=function(){var o=$("#pwBody").classList.toggle("open");$("#pwFold").setAttribute("aria-expanded",o)};
  $("#pwBtn").onclick=function(){
    var a=$("#pw0").value,b=$("#pw1").value,e=$("#pwErr");
    if(a!==c.pass){e.textContent="Current password is wrong";return}
    if(b.length<6){e.textContent="New password needs at least 6 characters";return}
    c.pass=b;save();e.textContent="";$("#pw0").value="";$("#pw1").value="";toast("Password updated")
  };
  function filter(){
    var q=$("#q").value.trim().toLowerCase(),h='<option value="">Select a script</option>',n=0,last="";
    db.scripts.forEach(function(s){if(s.name.toLowerCase().indexOf(q)>-1){h+='<option value="'+s.id+'">'+esc(s.name)+'</option>';n++;last=s.id}});
    $("#pick").innerHTML=h;if(q&&n===1)$("#pick").value=last;
  }
  $("#q").oninput=filter;
  $("#applyBtn").onclick=function(){
    var id=$("#pick").value;if(!id){toast("Select a script first");return}
    c.scriptId=id;save();$("#liveName").textContent=scriptById(id).name;toast("Script applied")
  };
  $("#linksBtn").onclick=function(){openLinks(c)};
  $("#outBtn").onclick=function(){clientId=null;renderLogin()};
}
function openLinks(c){
  touched=c;
  function draw(){
    touched=c;
    var h='<h2 class="card-h disp" style="font-size:16px">Shortlinks</h2><p class="sub">Every link opens your live script.</p>';
    c.links.forEach(function(s){
      h+='<div class="link-row"><div class="u">'+esc(fullUrl(s).replace(/^https?:\/\//,""))+'</div><button class="mini" data-c="'+s+'">Copy</button><button class="mini" data-o="'+s+'">Open</button>'+(c.links.length>1?'<button class="mini del" data-d="'+s+'">Delete</button>':'')+'</div>';
    });
    h+='<div style="margin-top:16px"><input class="in deep s" id="ns" placeholder="new-link-name" autocapitalize="off"><div class="err" id="nsErr"></div>'+
       '<div class="row"><button class="btn sm" id="nsAdd">Add shortlink</button><button class="btn sm ghost" id="nsClose">Close</button></div></div>';
    var d=dlg(h);
    d.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){copy(fullUrl(b.dataset.c))}});
    d.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){var w=window.open(fullUrl(b.dataset.o),"_blank");if(!w){closeDlg();location.href=fullUrl(b.dataset.o)}}});
    d.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){if(!confirm("Delete /s/"+b.dataset.d+"?"))return;c.links=c.links.filter(function(x){return x!==b.dataset.d});save();draw();toast("Shortlink deleted")}});
    $("#nsClose").onclick=closeDlg;
    $("#nsAdd").onclick=function(){
      var s=cleanSlug($("#ns").value),e=$("#nsErr");
      if(s.length<3){e.textContent="Use at least 3 letters or numbers";return}
      if(c.links.length>=10){e.textContent="Limit is 10 shortlinks";return}
      if(slugTaken(s)){e.textContent="That name is taken. Try another";return}
      e.textContent="Checking...";
      slugTakenRemote(s,function(taken,ok){
        if(!ok){e.textContent="Cannot reach the server. Try again.";return}
        if(taken){e.textContent="That name is taken. Try another";return}
        c.links.push(s);touched=c;save();draw();toast("Shortlink added")
      });
    };
  }
  draw();
}
function renderLogin(){
  $("#app").innerHTML=
  '<div class="wrap"><div class="disp" style="font-size:18px">WIZARD WEB PANEL</div><div class="rule"></div>'+
  '<div class="dash"><label class="lbl" for="lid">User ID</label><input class="in" id="lid" autocomplete="username" autocapitalize="off">'+
  '<label class="lbl" for="lpw">Password</label><input class="in" id="lpw" type="password" autocomplete="current-password">'+
  '<div class="err" id="lerr"></div><button class="btn" id="lbtn">Login</button></div>'+
  '</div>';
  function doLogin(){
    var e=$("#lerr");e.textContent="Checking...";
    pull(function(ok){
    if(!ok){e.textContent="Cannot reach the server. Try again.";return}
    var c=clientByLogin($("#lid").value);
    if(!c||c.pass!==$("#lpw").value){e.textContent="Wrong ID or password";return}
    var st=status(c);
    if(st==="expired"){e.textContent="This account has expired. Contact the owner.";return}
    if(st==="disabled"){e.textContent="This account is disabled. Contact the owner.";return}
    clientId=c.id;renderPanel();
    });
  }
  $("#lbtn").onclick=doLogin;
  $("#lpw").onkeydown=function(e){if(e.key==="Enter")doLogin()};
}


if(needSetup()){$("#app").innerHTML='<div class="site-msg">Setup needed: add your Firebase URL at the top of the script in client.html</div>'}
