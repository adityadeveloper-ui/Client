  try{ if(!sessionStorage.getItem("v-"+slug)){sessionStorage.setItem("v-"+slug,"1");c.visitors=(c.visitors||0)+1;save()} }catch(e){}
  var html=personalize(s,c);
  currentHash=s.id+"/"+hashStr(s.html||"")+"/"+hashStr([c.upi||"",c.pn||"",c.tr||""].join("|")+"|"+(c.pn||"").length);   /* a saved place only belongs to this exact script */
  var data=JSON.stringify({upi:c.upi||"",pn:c.pn||"",tr:c.tr||"",dbg:/[?&]debug/i.test(location.search+location.hash)?1:0}).replace(/</g,"\\u003c");
  var inject='<script>window.PANEL='+data+';<\/script>'+agentTag(loadSnap(slug,currentHash));
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+inject}):inject+html;
  app.innerHTML='<iframe class="site-frame" id="siteFrame" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox allow-top-navigation-to-custom-protocols" title="Site"></iframe>';
  $("#siteFrame").srcdoc=html;
}

/* ---------- client panel ---------- */
function renderPanel(){
  currentView="panel";currentSlug=null;
  var app=$("#app");
  var c=clientId?clientByLogin(clientId):null;
  if(c&&status(c)!=="live"){clientId=null;c=null}
  if(!c)return renderLogin();
  touched=c;
  var opts='<option value="">Select a script</option>';
  db.scripts.forEach(function(s){opts+='<option value="'+s.id+'">'+esc(s.name)+'</option>'});
  var cur=scriptById(c.scriptId);
  app.innerHTML=
  '<div class="wrap">'+
   '<div class="head"><div class="disp">Wizard Web Panel</div><span class="badge">Account settings</span></div>'+
   '<div class="stats"><div class="stat"><span>Expires in</span><b>'+daysLeft(c)+' days</b></div><div class="stat"><span>Visitors</span><b>'+(c.visitors||0)+'</b></div></div>'+
   '<div class="dash">'+
     '<h2 class="card-h">Payment details</h2><p class="sub">These go into every payment link on your web.</p>'+
     '<label class="lbl" for="upi">Your UPI</label><input class="in" id="upi" value="'+esc(c.upi||"")+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
     '<label class="lbl" for="pn">Payee name<small>Shown when your customer pays</small></label><input class="in" id="pn" maxlength="99" value="'+esc(c.pn||"")+'" autocomplete="off" autocapitalize="words" spellcheck="false">'+
     '<label class="lbl" for="tr">Your TR</label><input class="in" id="tr" value="'+esc(c.tr||"")+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
     '<button class="btn" id="saveBtn">Save changes</button>'+
   '</div>'+
   '<div class="dash fold-card">'+
     '<button class="fold" id="pwFold" aria-expanded="false"><span>Change password</span><span class="chev"></span></button>'+
     '<div class="fold-body" id="pwBody">'+
       '<input class="in deep" id="pw0" type="password" placeholder="Current password" autocomplete="current-password">'+
       '<input class="in deep" id="pw1" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password">'+
       '<div class="err" id="pwErr"></div>'+
       '<button class="btn" id="pwBtn">Update password</button>'+
     '</div>'+
   '</div>'+
   '<div class="dash">'+
     '<h2 class="card-h">Choose a script</h2><p class="sub">Pick the design your web shows to customers.</p>'+
     '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search script by name" autocomplete="off" aria-label="Search scripts"></div>'+
     '<div class="sel"><select id="pick" aria-label="Script">'+opts+'</select></div>'+
     '<button class="btn" id="applyBtn">Apply script</button>'+
     '<div class="live">Live now: <b id="liveName">'+(cur?esc(cur.name):"Nothing")+'</b></div>'+
   '</div>'+
   '<div class="stack">'+
     '<button class="btn big" id="linksBtn">Manage shortlinks</button>'+
     '<button class="btn ghost" id="outBtn">Log out</button>'+
   '</div>'+
   '<div class="ver">v4 - payee name locked into every payment link</div>'+
  '</div>';

  $("#saveBtn").onclick=function(){
    var u=$("#upi").value.trim(),raw=$("#pn").value.trim(),p=cleanPn(raw),t=$("#tr").value.trim();
    if(u&&!UPI_RE.test(u)){toast("UPI ID looks wrong. Use name@bank");return}
    if(t&&!TR_RE.test(t)){toast("TR can only have letters, numbers . _ - (max 35)");return}
    c.upi=u;c.pn=p;c.tr=t;$("#pn").value=p;
    save(function(ok){toast(ok?(p!==raw?"Saved. Payee name cleaned to: "+p:"Saved. Payee name is now in every payment link"):"Could not save. Check your connection")});
  };
  $("#pwFold").onclick=function(){var o=$("#pwBody").classList.toggle("open");$("#pwFold").setAttribute("aria-expanded",o)};
  $("#pwBtn").onclick=function(){
    var a=$("#pw0").value,b=$("#pw1").value,e=$("#pwErr");
    if(a!==c.pass){e.textContent="Current password is wrong";return}
    if(b.length<6){e.textContent="New password needs at least 6 characters";return}
    c.pass=b;save();e.textContent="";$("#pw0").value="";$("#pw1").value="";toast("Password updated")
  };
  function filter(){
    var q=$("#q").value.trim().toLowerCase(),h='<option value="">Select a script</option>',n=0,last="";
    db.scripts.forEach(function(s){if(s.name.toLowerCase().indexOf(q)>-1){h+='<option value="'+s.id+'">'+esc(s.name)+'</option>';n++;last=s.id}});
    $("#pick").innerHTML=h;if(q&&n===1)$("#pick").value=last;
  }
  $("#q").oninput=filter;
  $("#applyBtn").onclick=function(){
    var id=$("#pick").value;if(!id){toast("Select a script first");return}
    c.scriptId=id;save();$("#liveName").textContent=scriptById(id).name;toast("Script applied")
  };
  $("#linksBtn").onclick=function(){go("#/links")};
  $("#outBtn").onclick=function(){clientId=null;renderLogin()};
}
function domainList(c){
  var dl=(db.shortDomains||[]).slice();
  Object.keys((c&&c.meta)||{}).forEach(function(k){var d=c.meta[k]&&c.meta[k].d;if(d&&dl.indexOf(d)<0)dl.push(d)});
  return dl;
}
function refreshDomains(){
  var s=$("#sd");if(!s||!clientId)return;
  var c=clientByLogin(clientId);if(!c)return;
  var v=s.value,h='<option value="">Select Domain</option>';
  domainList(c).forEach(function(d){h+='<option value="'+esc(d)+'">'+esc(d)+'</option>'});
  s.innerHTML=h;s.value=v;
}
function renderLinks(){
  currentView="links";currentSlug=null;
  var c=clientId?clientByLogin(clientId):null;
  if(c&&status(c)!=="live"){clientId=null;c=null}
  if(!c)return renderLogin();
  touched=c;document.title="Make Shortlink";
  if(!c.meta||typeof c.meta!=="object")c.meta={};
  var editing=null;
  var dl=domainList(c);
  var dOpts='<option value="">Select Domain</option>',tOpts='<option value="">Select Theme</option><option value="direct">&#9889; Direct (uses my applied script)</option>';
  dl.forEach(function(d){dOpts+='<option value="'+esc(d)+'">'+esc(d)+'</option>'});
  db.scripts.forEach(function(x){tOpts+='<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>'});
  $("#app").innerHTML=
  '<div class="wrap">'+
   '<a class="back" id="bk" role="button" tabindex="0">&#8592; Back to panel</a>'+
   '<h1 class="disp mk-title">Make shortlink</h1>'+
   '<div class="hl"><b>Current web URL</b><span id="cur"></span></div>'+
   '<div class="dash">'+
     '<h2 class="card-h">New shortlink</h2><p class="sub">Choose a domain and a theme, then create your link.</p>'+
     '<label class="lbl" for="sd">Shortlink domain</label><div class="sel"><select id="sd">'+dOpts+'</select></div>'+
     '<label class="lbl" for="st">Theme</label><div class="sel"><select id="st">'+tOpts+'</select></div>'+
     '<div class="err" id="mkErr"></div>'+
     '<button class="btn" id="mk">Create shortlink</button>'+
   '</div>'+
   '<div class="dash">'+
     '<h2 class="card-h ys">Your shortlinks <small id="tot"></small></h2>'+
     '<div id="list"></div>'+
   '</div>'+
  '</div>';
  window.scrollTo(0,0);
  $("#bk").onclick=function(){go("#/panel")};
  $("#bk").onkeydown=function(e){if(e.key==="Enter")go("#/panel")};
  function themeName(slug){var m=c.meta[slug]||{};if(m.t==="direct")return "Direct";var x=scriptById(m.t||c.scriptId);return x?x.name:""}
  function draw(){
    $("#cur").textContent=mainUrl(c).replace(/^https:/,"http:");
    $("#tot").textContent="(Total "+c.links.length+")";
    var h="";
    c.links.forEach(function(sl){
      var u=fullUrl(sl);
      h+='<div class="sl'+(editing===sl?' editing':'')+'"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'+
         '<div class="tr"><span class="tg">Target: '+esc(mainUrl(c).replace(/^https:/,"http:"))+'</span><span class="th">'+esc(themeName(sl))+'</span></div>'+
         '<div class="ab"><button class="cp" data-c="'+sl+'">Copy</button><button class="ed" data-e="'+sl+'">Edit</button>'+(c.links.length>1?'<button class="dl" data-d="'+sl+'">Delete</button>':'')+'</div></div>';
    });
    if(!c.links.length)h='<div class="empty">No shortlinks yet.</div>';
    $("#list").innerHTML=h;
    $("#list").querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){copy(fullUrl(b.dataset.c))}});
    $("#list").querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){
      var m=c.meta[b.dataset.e]||{};editing=b.dataset.e;
      $("#sd").value=m.d||"";$("#st").value=m.t||"";$("#mk").textContent="Update shortlink";$("#mkErr").textContent="";
      draw();window.scrollTo(0,0);
    }});
    $("#list").querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){
      if(!confirm("Delete this shortlink?"))return;
      var s=b.dataset.d;c.links=c.links.filter(function(x){return x!==s});delete c.meta[s];
      if(editing===s){editing=null;$("#mk").textContent="Create shortlink"}
      touched=c;save();draw();toast("Shortlink deleted")
    }});
  }
  $("#mk").onclick=function(){
    var d=$("#sd").value,t=$("#st").value,e=$("#mkErr");
    if(!d){e.textContent="Select a domain";return}
    if(!t){e.textContent="Select a theme";return}
    e.textContent="";
    if(editing){
      c.meta[editing]={d:d,t:t};editing=null;$("#mk").textContent="Create shortlink";
      $("#sd").value="";$("#st").value="";touched=c;save();draw();toast("Shortlink updated");return;
    }
    if(c.links.length>=10){e.textContent="Limit is 10 shortlinks";return}
    var s,n=0;do{s=rnd(6,"abcdefghijklmnopqrstuvwxyz0123456789");n++}while(slugTaken(s)&&n<20);
    e.textContent="Creating...";
    slugTakenRemote(s,function(taken,ok){
      if(!ok){e.textContent="Cannot reach the server. Try again.";return}
      if(taken){e.textContent="Try again";return}
      e.textContent="";c.links.push(s);c.meta[s]={d:d,t:t};touched=c;save();
      $("#sd").value="";$("#st").value="";draw();toast("Shortlink created")
    });
  };
  draw();
}
function renderLogin(){
  currentView="login";currentSlug=null;
  $("#app").innerHTML=
  '<div class="wrap"><div class="disp" style="font-size:18px">WIZARD WEB PANEL</div><div class="rule"></div>'+
  '<div class="dash"><h2 class="card-h">Log in</h2><p class="sub">Use the ID and password you received from the owner.</p><label class="lbl" for="lid">User ID</label><input class="in" id="lid" autocomplete="username" autocapitalize="off">'+
  '<label class="lbl" for="lpw">Password</label><input class="in" id="lpw" type="password" autocomplete="current-password">'+
  '<div class="err" id="lerr"></div><button class="btn" id="lbtn">Log in</button></div>'+
  '</div>';
  function doLogin(){
    var e=$("#lerr");e.textContent="Checking...";
    pull(function(ok){
    if(!ok){e.textContent="Cannot reach the server. Try again.";return}
    var c=clientByLogin($("#lid").value);
    if(!c||c.pass!==$("#lpw").value){e.textContent="Wrong ID or password";return}
    var st=status(c);
    if(st==="expired"){e.textContent="This account has expired. Contact the owner.";return}
    if(st==="disabled"){e.textContent="This account is disabled. Contact the owner.";return}
    clientId=c.id;renderPanel();
    });
  }
  $("#lbtn").onclick=doLogin;
  $("#lpw").onkeydown=function(e){if(e.key==="Enter")doLogin()};
}


var LOAD_SCREEN='<div class="load-screen" style="flex-direction:column"><div class="load-spin"></div><div id="ls" style="min-height:16px"></div></div>';
if(needSetup()){$("#app").innerHTML='<div class="site-msg">Setup needed: add your Firebase URL at the top of the script in client.html</div>'}
else{$("#app").innerHTML=LOAD_SCREEN;var __ps=slugFromPath();(__ps?function(cb){pullSite(__ps,cb)}:pull)(function(ok){if(!ok){$("#app").innerHTML='<div class="load-screen" style="flex-direction:column"><span>Cannot reach the server.</span><span style="font-size:11px;opacity:.7">'+esc(LOADERR||"")+'</span><button class="btn sm" style="width:auto;padding:0 24px" onclick="location.reload()">Retry</button></div>';return}route()})}
})();
