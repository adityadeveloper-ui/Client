<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIZARD WEB PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d;
  --line:#2c3748; --cyan:#00b8f0; --text:#e8eef6; --muted:#8793a5;
  --grad:linear-gradient(90deg,#0090f0,#00e5ff); --danger:#ff5d6c; --ok:#2ee59d; --row:#111a2b;
  --btn-ink:#fff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
    --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
  --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
}
:root[data-theme="dark"]{
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d; --line:#2c3748; --cyan:#00b8f0;
  --text:#e8eef6; --muted:#8793a5; --row:#111a2b; --btn-ink:#fff;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.wrap.wide{max-width:760px}
.disp{font-family:Orbitron,Roboto,sans-serif;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

/* panel header */
.head{display:grid;grid-template-columns:1fr auto;gap:14px 12px;font-size:14px}
.head .r{text-align:right}
.rule{height:2px;background:var(--cyan);opacity:.9;margin:22px 0}
.rule.tall{margin:40px 0 22px}

.dash{border:2px dashed var(--line);border-radius:16px;padding:18px;background:transparent;margin-bottom:18px}
.dash .lbl{display:block;font-size:17px;margin:0 0 10px;color:var(--text)}
.in{display:block;width:100%;background:var(--field);border:1px solid transparent;border-radius:14px;height:60px;padding:0 18px;font-size:19px;margin-bottom:20px}
.in:focus{border-color:var(--cyan);outline:0}
.in.deep{background:var(--field-deep);border-color:var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--field-deep);border:1px solid var(--line);border-radius:14px;padding:0 16px;height:58px;margin-bottom:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:19px}
.search input::placeholder,.in::placeholder{color:var(--muted)}
.sel{position:relative;margin-bottom:16px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:62px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 50px 0 22px;font-size:21px;cursor:pointer}
.sel::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:block;width:100%;height:58px;border:0;border-radius:16px;background:var(--grad);color:var(--btn-ink);font-weight:700;font-size:18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.big{height:64px;border-radius:20px;font-size:19px}
.btn.dark{background:#000;color:#fff;height:58px;border-radius:0;margin-top:14px}
.btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--row);border:0;border-radius:10px;padding:18px 20px;font-size:21px;cursor:pointer;text-align:left}
.fold span.ar{font-size:15px;transition:transform .15s}
.fold[aria-expanded="true"] span.ar{transform:rotate(90deg)}
.fold-body{display:none;padding:16px 4px 0}
.fold-body.open{display:block}
.note{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.live{color:var(--muted);font-size:14px;margin-top:12px}
.live b{color:var(--text);font-weight:500}
.err{color:var(--danger);font-size:15px;margin:-6px 0 14px;min-height:1px}
.demo-link{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:22px;text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}

/* owner site */
.title{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 18px}
.card-h{font-size:19px;margin:0 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.in.s{height:50px;font-size:16px;margin-bottom:12px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:500;word-break:break-word}
.item .meta{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.mini.del{color:var(--danger)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--danger);border-color:var(--danger)}
.cred{background:var(--field);border:1px solid var(--cyan);border-radius:14px;padding:14px;margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.staged{background:var(--field);border-radius:12px;padding:12px;margin-bottom:10px}
.staged small{color:var(--muted);display:block;margin-bottom:8px;word-break:break-all}
dialog{width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.link-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.link-row .u{flex:1;min-width:0;word-break:break-all;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--cyan);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.site-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.load-screen{position:fixed;inset:0;background:#eef1f6;z-index:999;display:flex;align-items:center;justify-content:center}
.load-spin{width:34px;height:34px;border-radius:50%;border:3px solid transparent;border-top-color:#2a7dfa;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* make shortlink page */
.wrap.mkw{padding:28px clamp(16px,11vw,59px) 48px}
.back{display:inline-block;color:#1a8cff;font-size:20px;text-decoration:none;cursor:pointer;margin:24px 0 50px}
.mk-title{font-size:26px;margin:0 0 27px;line-height:1.15}
.hl{background:#000;border:4px solid #7ec8ff;border-radius:16px;padding:14px 16px 16px;margin-bottom:19px}
.hl b{display:block;color:#1565d8;font-size:20px;font-weight:700;margin-bottom:2px}
.hl span{font-size:17px;word-break:break-all;color:#fff}
.tip{background:#000;border:4px solid #3aa0f0;min-height:91px;display:flex;align-items:center;padding:0 6px;margin-bottom:26px;font-size:16px;font-weight:700;color:#fff;line-height:1.3}
.fl{display:block;font-size:17px;margin:0 0 12px;color:#d7dde5}
.mk-sel{margin-bottom:34px}
.mk-sel select{background:#111116;border-color:#1e1e26;border-radius:16px}
.mk-btn{border-radius:20px;color:#fff;margin:48px 0 0;box-shadow:0 10px 30px rgba(0,160,255,.16)}
.mk-hr{height:4px;background:#d8d8d8;margin:32px 0 40px}
.ys{font-size:19px;margin:0 0 22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;text-transform:none}
.ys small{font-size:13px;color:#7d8794;letter-spacing:.08em}
.sl{background:#00d9ec;border-radius:10px;padding:16px;margin-bottom:10px;color:#06222c}
.sl>a{display:block;color:#1750d4;font-size:17px;line-height:1.4;word-break:break-all}
.sl .tr{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:3px}
.sl .tg{font-size:14px;word-break:break-all;color:#06222c}
.sl .th{color:#fff;font-size:15px;white-space:nowrap}
.sl .ab{display:flex;gap:11px;margin-top:20px;flex-wrap:wrap}
.sl .ab button{border:0;border-radius:4px;color:#fff;font-size:17px;line-height:19px;padding:8px 21px;cursor:pointer}
.sl .cp{background:#4caf50}.sl .ed{background:#2196f3}.sl .dl{background:#e5004f}
.sl.editing{outline:3px solid #fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var K="exp-web-panel-v2", mem=null;
document.documentElement.setAttribute("data-theme","dark");
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function rnd(n,set){var o="";for(var i=0;i<n;i++)o+=set.charAt(Math.floor(Math.random()*set.length));return o}
var SAMPLE='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b1626;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}h1{margin:0 0 10px}p{opacity:.8}</style></head><body><div><h1>Sample page</h1><p>UPI: {{UPI}}<br>Reference: {{TR}}</p></div></body></html>';

var REMOTE="https://wizard-web-fadd8-default-rtdb.firebaseio.com";
var BASE=REMOTE.replace(/\/+$/,"")+"/panel";
function ck(id){return String(id).trim().toLowerCase().replace(/[^a-z0-9@_-]/g,function(c){return "_"+c.charCodeAt(0).toString(16)+"_"})}

function needSetup(){return /PASTE_FIREBASE_URL_HERE/.test(REMOTE)}
var DOMAINS=["bxdt.in","sayurl.in","softurl.pro","zipcut.tech","gggggg.pro"];

function load(){return db}
function pull(cb){
  Promise.all(["clients","scripts","domain"].map(function(n){return fetch(BASE+"/"+n+".json").then(function(r){if(!r.ok)throw 0;return r.json()})})).then(function(a){
    db={owner:null,domain:a[2]||"",scripts:arr(a[1]),clients:arr(a[0]).map(function(c){c.links=arr(c.links);return c})};
    if(cb)cb(true);
  }).catch(function(){if(cb)cb(false)});
}
var touched=null;

}
function refreshPick(){

  var v=p.value,q=$("#q").value.trim().toLowerCase(),h='<option value="">Select a script</option>';

  p.innerHTML=h;p.value=v;

var currentView=null,currentSlug=null;
/* The open shop page is never redrawn by the panel. When the client changes UPI/TR the new values are handed to the open page
   (no reload). Anything else (script, expiry, ...) is picked up the next time the visitor refreshes Chrome themselves. */
function liveSig(c){return c?[c.upi||"",c.tr||""].join("|"):""}
function checkLive(){
  if(document.hidden||needSetup())return;
  var sl=currentView==="site"?currentSlug:null,c0=sl?clientBySlug(sl):null,before=liveSig(c0);
  pull(function(ok){
    if(!ok)return;
    refreshPick();
    if(!sl||currentView!=="site"||currentSlug!==sl)return;
    var c=clientBySlug(sl);if(!c||liveSig(c)===before)return;
    var f=$("#siteFrame");if(f&&f.contentWindow)f.contentWindow.postMessage({__panel:{upi:c.upi||"",tr:c.tr||""}},"*");
  });
}
document.addEventListener("visibilitychange",checkLive);
var clientId=null;
setInterval(checkLive,15000);

function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},2200)}
function copy(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied")},function(){fb()});return}}catch(e){}
  fb();
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Copied":"Press and hold to copy it manually")}
}
function daysLeft(c){return Math.ceil((c.expiresAt-Date.now())/86400000)}
function status(c){if(!c.active)return "disabled";if(c.expiresAt<=Date.now())return "expired";return "live"}
function scriptById(id){return db.scripts.filter(function(s){return s.id===id})[0]}

function linkMeta(slug){var c=clientBySlug(slug);return (c&&c.meta&&c.meta[slug])||{}}

function slugTakenRemote(slug,cb){
  fetch(BASE+"/clients.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
    cb(arr(o).some(function(c){return arr(c.links).indexOf(slug)>-1}),true)
  }).catch(function(){cb(false,false)});
}
function dlg(html){var d=$("#dlg");d.innerHTML=html;if(!d.open)d.showModal();return d}
function closeDlg(){var d=$("#dlg");if(d.open)d.close()}

function detectSrc(html){
  function dec(x){try{return decodeURIComponent(x)}catch(e){return x}}
  var u=html.match(/[?&;]pa=([^&"'\s<>\\]+)/i),t=html.match(/[?&;]tr=([^&"'\s<>\\]+)/i);
  var upi=u?dec(u[1]):"",tr=t?dec(t[1]):"";
  if(upi.indexOf("@")<1){var j=html.match(/"upi"\s*:\s*"([^"\\]+)"/);if(j)upi=dec(j[1])}
  if(upi.indexOf("@")<1||upi.length<5)upi="";
  if(tr.length<3)tr="";
  return {upi:upi,tr:tr};
}
function rep(h,src,val){
  if(!src||!val||src===val)return h;
  h=h.split(src).join(val);

}
/* builds the per-client web page; the saved original HTML is never changed */
function personalize(s,c){
  var upi=String(c.upi||"").trim(),tr=String(c.tr||"").trim();
  var h=s.html.split("{{UPI}}").join(upi).split("{{TR}}").join(tr);
  var d=(s.srcUpi===undefined||s.srcTr===undefined)?detectSrc(s.html):null;

      "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;"+
      "var h=a.getAttribute('href')||'';if(/^(upi|phonepe|paytmmp|tez|gpay|intent):/i.test(h))a.setAttribute('href',fix(h))},true)})();<"+"/script>";
    h=/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,function(m){return m+fb}):fb+h;

/* ---------- router ---------- */
function route(){
  var h=location.hash||"#/panel";
  document.body.style.background="";document.title="WIZARD WEB PANEL";
  var ps=slugFromPath();if(ps)return renderSite(ps);
  if(h.indexOf("#/s/")===0)return renderSite(h.slice(4));

}

function go(h){if(location.hash===h)route();else location.hash=h}

/* Keeps the visitor's place in ANY script. A small helper is added to the served page (and to any page it opens in a frame).
   It saves the page's visible state + changed variables, and puts them back if the page is reloaded (for example after Chrome
   unloads the tab while the PhonePe/Paytm app is open). Nothing needs to be added to the scripts themselves. */
var AGENT_SRC=(function AGENT(cfg){
if(window.__AG)return;window.__AG=1;
var W=window,D=document,lvl=cfg.lvl||0,saved=cfg.saved||null;
var BK={};try{Object.keys(W).forEach(function(k){BK[k]=1})}catch(e){}

function post(m){try{if(parent!==W)parent.postMessage(m,'*')}catch(e){}}
function frames(){return D.querySelectorAll('iframe')}
