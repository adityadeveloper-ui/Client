<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrink script images</title>
<style>
:root{--bg:#f5f9ff;--card:#fff;--text:#0f1b2d;--muted:#5b6b85;--line:#d9e2f1;--accent:#1565ea;--ok:#0d7a3e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1626;--card:#122137;--text:#eaf1fb;--muted:#9fb0c9;--line:#243a58;--accent:#4d8dff;--ok:#4cd98a}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=file]{width:100%}
input[type=range]{width:100%}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px system-ui;margin-top:14px}
button:disabled{opacity:.5}
.big{font-size:28px;font-weight:700}
.ok{color:var(--ok)}
#log{font-size:14px;color:var(--muted);white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>Shrink script images</h1>
<p>Your scripts hold huge images inside the HTML, so pages load slowly. Pick the script file and this makes the images smaller, then gives you a new file to upload again.</p>

<div class="card">
<label for="f">Script HTML file</label>
<input id="f" type="file" accept=".html,.htm,text/html">
<div id="src" class="row" style="margin-top:8px"></div>

<label for="w">Max image width: <b id="wv">800</b> px</label>
<input id="w" type="range" min="320" max="1600" step="40" value="800">
<label for="q">Quality: <b id="qv">60</b>%</label>
<input id="q" type="range" min="30" max="90" step="5" value="60">

<button id="go" disabled>Shrink images</button>
</div>

<div class="card" id="res" hidden>
<div class="row"><span>Before</span><span id="b"></span></div>
<div class="row"><span>After</span><span id="a"></span></div>
<div class="big ok" id="pct"></div>
<div id="log"></div>
<button id="dl">Download new file</button>
</div>
</main>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var text="",name="script.html",out="",outName="script-small.html";
function size(n){return n>1048576?(n/1048576).toFixed(2)+" MB":Math.round(n/1024)+" KB"}
$("#w").oninput=function(){$("#wv").textContent=this.value};
$("#q").oninput=function(){$("#qv").textContent=this.value};

$("#f").onchange=function(){
  var f=this.files[0];if(!f)return;
  name=f.name;outName=f.name.replace(/\.html?$/i,"")+"-small.html";
  f.text().then(function(t){
    text=t;
    var n=(t.match(/data:image\/(?:png|jpe?g|webp);base64,/g)||[]).length;
    $("#src").textContent=size(t.length)+" · "+n+" inline image"+(n===1?"":"s");
    $("#go").disabled=false;$("#res").hidden=true;
  });
};

function shrink(u,maxW,q){
  return new Promise(function(res){
    var i=new Image();
    i.onload=function(){
      var k=Math.min(1,maxW/i.naturalWidth),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(i.naturalWidth*k));c.height=Math.max(1,Math.round(i.naturalHeight*k));
      c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      var o=c.toDataURL("image/webp",q);
      if(o.indexOf("data:image/webp")!==0)o=c.toDataURL("image/jpeg",q);
      res(o.length<u.length?o:u);
    };
    i.onerror=function(){res(u)};
    i.src=u;
  });
}

$("#go").onclick=function(){
  var btn=this,maxW=+$("#w").value,q=+$("#q").value/100;
  var re=/data:image\/(?:png|jpe?g|webp);base64,[A-Za-z0-9+\/=]{20000,}/g;
  var hits=[],m;while((m=re.exec(text)))hits.push({i:m.index,s:m[0]});
  btn.disabled=true;$("#res").hidden=false;$("#log").textContent="Working…";
  $("#b").textContent=size(text.length);$("#a").textContent="…";$("#pct").textContent="";
  var parts=[],last=0,k=0;
  (function next(){
    if(k>=hits.length){
      parts.push(text.slice(last));out=parts.join("");
      $("#a").textContent=size(out.length);
      $("#pct").textContent=hits.length?Math.round((1-out.length/text.length)*100)+"% smaller":"No large images found";
      $("#log").textContent=hits.length+" image"+(hits.length===1?"":"s")+" processed. Upload the new file in your owner panel in place of the old script.";
      btn.disabled=false;return;
    }
    var h=hits[k];
    $("#log").textContent="Image "+(k+1)+" of "+hits.length+"…";
    shrink(h.s,maxW,q).then(function(n){
      parts.push(text.slice(last,h.i),n);last=h.i+h.s.length;k++;setTimeout(next,0);
    });
  })();
};

$("#dl").onclick=function(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));
  a.download=outName;document.body.appendChild(a);a.click();a.remove();
};
})();
</script>
</body>
</html>
