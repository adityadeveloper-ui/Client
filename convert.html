<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move script images to Supabase</title>
<style>
:root{--bg:#f5f9ff;--card:#fff;--text:#0f1b2d;--muted:#5b6b85;--line:#d9e2f1;--accent:#1565ea;--ok:#0d7a3e;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0b1626;--card:#122137;--text:#eaf1fb;--muted:#9fb0c9;--line:#243a58;--accent:#4d8dff;--ok:#4cd98a;--bad:#ff7b7b}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=file],input[type=range]{width:100%}
.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin-top:14px}
button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px system-ui;margin-top:14px}
button:disabled{opacity:.5}
.big{font-size:26px;font-weight:700;color:var(--ok)}
#log{font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
#log.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Move script images to Supabase</h1>
<p>Pick your script file. Every inline image is shrunk, uploaded to your <b>Quality</b> bucket, and replaced by a short link. Your products, text and layout stay the same. The original file is not changed.</p>

<div class="card">
<label for="f">Script HTML file</label>
<input id="f" type="file" accept=".html,.htm,text/html">
<div id="src" class="row" style="margin-top:8px"></div>

<label for="w">Max image width: <b id="wv">880</b> px</label>
<input id="w" type="range" min="400" max="1600" step="40" value="880">
<label for="q">Quality: <b id="qv">80</b>%</label>
<input id="q" type="range" min="40" max="95" step="5" value="80">
<label class="chk"><input id="lz" type="checkbox" checked> Load images when scrolled to (skips the first image)</label>

<button id="go" disabled>Convert and upload</button>
</div>

<div class="card" id="res" hidden>
<div class="row"><span>Script size before</span><span id="b"></span></div>
<div class="row"><span>Script size after</span><span id="a"></span></div>
<div class="big" id="pct"></div>
<div id="log"></div>
<button id="dl" hidden>Download new script file</button>
</div>
</main>

<script>
(function(){
var SB_URL="https://tijqvvqsqsgxwusmhwms.supabase.co";
var SB_KEY="sb_publishable_4pLCK52KqxUZKa9J6RA9uA_x08LdcYL";
var BUCKET="Quality";

var $=function(s){return document.querySelector(s)};
var text="",outName="script-small.html",out="";
function size(n){return n>1048576?(n/1048576).toFixed(2)+" MB":Math.round(n/1024)+" KB"}
function log(m,bad){var l=$("#log");l.textContent=m;l.className=bad?"bad":""}
function hash(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
var RE=/data:image\/(?:png|jpe?g|webp);base64,[A-Za-z0-9+\/=]{3000,}/g;

$("#w").oninput=function(){$("#wv").textContent=this.value};
$("#q").oninput=function(){$("#qv").textContent=this.value};

$("#f").onchange=function(){
  var f=this.files[0];if(!f)return;
  outName=f.name.replace(/\.html?$/i,"")+"-small.html";
  f.text().then(function(t){
    text=t;
    var n=(t.match(RE)||[]).length;
    $("#src").textContent=size(t.length)+" · "+n+" inline image"+(n===1?"":"s");
    $("#go").disabled=false;$("#res").hidden=true;
  });
};

function toBlob(u,maxW,q){
  return new Promise(function(res,rej){
    var i=new Image();
    i.onload=function(){
      var k=Math.min(1,maxW/i.naturalWidth),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(i.naturalWidth*k));c.height=Math.max(1,Math.round(i.naturalHeight*k));
      c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      c.toBlob(function(b){
        if(b&&b.type==="image/webp")return res({b:b,ext:"webp"});
        c.toBlob(function(j){j?res({b:j,ext:"jpg"}):rej(new Error("image encode failed"))},"image/jpeg",q);
      },"image/webp",q);
    };
    i.onerror=function(){rej(new Error("image could not be read"))};
    i.src=u;
  });
}

function upload(name,blob){
  return fetch(SB_URL+"/storage/v1/object/"+BUCKET+"/"+name,{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":blob.type,"cache-control":"max-age=31536000"},
    body:blob
  }).then(function(r){
    if(r.ok)return;
    return r.text().then(function(t){
      if(r.status===409||/already exists|Duplicate/i.test(t))return;
      throw new Error("Upload failed ("+r.status+"): "+t.slice(0,200));
    });
  });
}

$("#go").onclick=function(){
  var btn=this,maxW=+$("#w").value,q=+$("#q").value/100,lazy=$("#lz").checked;
  var uniq=[],seen={},m;
  RE.lastIndex=0;
  while((m=RE.exec(text))){if(!seen[m[0]]){seen[m[0]]=1;uniq.push(m[0])}}
  btn.disabled=true;$("#dl").hidden=true;$("#res").hidden=false;
  $("#b").textContent=size(text.length);$("#a").textContent="…";$("#pct").textContent="";
  if(!uniq.length){log("No large inline images found in this file.");btn.disabled=false;return}
  var html=text,k=0,upBytes=0;
  (function next(){
    if(k>=uniq.length){finish();return}
    var u=uniq[k];
    log("Image "+(k+1)+" of "+uniq.length+"…");
    toBlob(u,maxW,q).then(function(r){
      var name=hash(u)+"-"+r.b.size.toString(36)+"."+r.ext;
      upBytes+=r.b.size;
      return upload(name,r.b).then(function(){
        html=html.split(u).join(SB_URL+"/storage/v1/object/public/"+BUCKET+"/"+name);
        k++;setTimeout(next,0);
      });
    }).catch(function(e){
      var msg=String(e&&e.message||e);
      if(/row-level security|403|401|Unauthorized/i.test(msg))msg+="\n\nFix: in Supabase, check the bucket is named Quality and run the upload SQL policy again.";
      log(msg,true);btn.disabled=false;
    });
  })();
  function finish(){
    if(lazy){var n=0;html=html.replace(/<img\b[^>]*>/gi,function(t){n++;return(n===1||/\sloading\s*=/i.test(t))?t:t.replace(/<img\b/i,'<img loading="lazy"')})}
    out=html;
    $("#a").textContent=size(out.length);
    $("#pct").textContent=Math.round((1-out.length/text.length)*100)+"% smaller";
    log(uniq.length+" image"+(uniq.length===1?"":"s")+" uploaded ("+size(upBytes)+" total). Upload the new file in your owner panel in place of the old script, and test with one client first.");
    $("#dl").hidden=false;btn.disabled=false;
  }
};

$("#dl").onclick=function(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));
  a.download=outName;document.body.appendChild(a);a.click();a.remove();
};
})();
</script>
</body>
</html>
